server:
  port: 8081
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    # Points at the pgvector/pgvector Postgres container from docker-compose.infra.yml
    # (host port 5433 -> container 5432), so every local service shares one database.
    url: jdbc:postgresql://localhost:5433/hexamed_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
