version: '3.8'

# Deployed on a single EC2 instance for the AWS demo (see AWS_DEPLOYMENT.md).
# Same services/images as docker-compose.yml, minus the pieces AWS provides natively:
#   - no "frontend" container -> the React build is served from S3 + CloudFront instead
#   - no "minio" container    -> document-service talks to a real S3 bucket instead
# Only api-gateway's port is published; everything else stays on the internal
# compose network and is reached only by other containers on this instance,
# matching the ALB -> EC2:8080 -> api-gateway path in the architecture doc.
#
# The 4 application services use the `awslogs` Docker logging driver instead of
# the default json-file driver, so their stdout/stderr goes straight to CloudWatch
# Logs (see AWS_DEPLOYMENT.md step 6b) — `docker compose logs` won't show anything
# for them anymore; use `aws logs tail /hexamed/<service> --follow` instead.
# Requires the EC2 instance role to have the logs:* permissions from step 2.

services:
  # ==========================================
  # INFRASTRUCTURE (self-hosted on the EC2 box instead of managed AWS services,
  # to avoid RDS/MSK cost — see the cost review in AWS_DEPLOYMENT.md)
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hexamed_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-hexamed_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - hexamed-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hexamed_redis
    restart: unless-stopped
    networks:
      - hexamed-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hexamed_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - hexamed-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ==========================================
  # MICROSERVICES
  # ==========================================
  clinical-service:
    build:
      context: ./clinical-service
      dockerfile: Dockerfile
    container_name: hexamed_clinical
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hexamed_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-password}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - hexamed-net
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_DEFAULT_REGION:-ap-south-1}
        awslogs-group: /hexamed/clinical-service
        awslogs-create-group: "true"
        awslogs-stream-prefix: clinical-service

  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: hexamed_document
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Real AWS S3 instead of MinIO — the MinIO Java SDK is S3-API-compatible,
      # so pointing it at the real regional endpoint + an IAM user's keys (scoped
      # to just this bucket) is all that's needed, no code change.
      - MINIO_ENDPOINT=${S3_ENDPOINT:-https://s3.ap-south-1.amazonaws.com}
      - MINIO_ACCESS_KEY=${S3_ACCESS_KEY}
      - MINIO_SECRET_KEY=${S3_SECRET_KEY}
      - MINIO_BUCKET_NAME=${S3_DOCUMENTS_BUCKET}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hexamed_db}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - hexamed-net
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_DEFAULT_REGION:-ap-south-1}
        awslogs-group: /hexamed/document-service
        awslogs-create-group: "true"
        awslogs-stream-prefix: document-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: hexamed_ai_engine
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-hexamed_db}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - CUSTOM_LLM_BASE_URL=${CUSTOM_LLM_BASE_URL}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - hexamed-net
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_DEFAULT_REGION:-ap-south-1}
        awslogs-group: /hexamed/ai-service
        awslogs-create-group: "true"
        awslogs-stream-prefix: ai-service

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: hexamed_gateway
    restart: unless-stopped
    ports:
      # The only port this instance needs published — this is the ALB target.
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=http://ai-service:8083
      # The CloudFront domain (or custom domain) the frontend is served from —
      # required or the browser will get blocked by CORS calling the ALB.
      - CORS_EXTRA_ORIGIN=${CORS_EXTRA_ORIGIN}
    depends_on:
      - clinical-service
      - document-service
      - ai-service
      - redis
    networks:
      - hexamed-net
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_DEFAULT_REGION:-ap-south-1}
        awslogs-group: /hexamed/api-gateway
        awslogs-create-group: "true"
        awslogs-stream-prefix: api-gateway

networks:
  hexamed-net:
    driver: bridge

volumes:
  postgres_data:
